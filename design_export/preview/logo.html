<!doctype html><html><head><meta charset="utf-8"><title>Logo & mark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .tile{background:var(--bg-muted);border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:130px;border:1px solid var(--border);}
  .tile.deep{background:var(--bg-deep);border:none;}
  .tile.cherry{background:var(--bg-cherry);border:none;}
  .tile .l{font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-muted);}
  .tile.deep .l{color:rgba(255,255,255,0.55);}
  .tile.cherry .l{color:rgba(255,255,255,0.85);}
  .word{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:30px;font-weight:700;letter-spacing:-0.03em;}
  .word svg{width:28px;height:28px;color:var(--accent);}
  .tile.deep .word, .tile.cherry .word{color:#fff;}
  .tile.deep .word svg{color:var(--accent);}
  .tile.cherry .word svg{color:#fff;}
</style></head><body>
<div class="tile">
  <div class="word"><svg viewBox="0 0 32 32" fill="currentColor"><circle cx="11" cy="22" r="6"/><circle cx="22" cy="22" r="6"/><path d="M16 4 C 14 9, 11 13, 9 17" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M16 4 C 18 9, 21 13, 23 17" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>cherry</div>
  <div class="l">on white</div>
</div>
<div class="tile deep">
  <div class="word"><svg viewBox="0 0 32 32" fill="currentColor"><circle cx="11" cy="22" r="6"/><circle cx="22" cy="22" r="6"/><path d="M16 4 C 14 9, 11 13, 9 17" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M16 4 C 18 9, 21 13, 23 17" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>cherry</div>
  <div class="l">on dark</div>
</div>
<div class="tile cherry">
  <div class="word"><svg viewBox="0 0 32 32" fill="currentColor"><circle cx="11" cy="22" r="6"/><circle cx="22" cy="22" r="6"/><path d="M16 4 C 14 9, 11 13, 9 17" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M16 4 C 18 9, 21 13, 23 17" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>cherry</div>
  <div class="l">on cherry</div>
</div>
</body></html>
