<!doctype html><html><head><meta charset="utf-8"><title>Header</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg);}
  .band{background:var(--bg);color:var(--fg);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
  .logo{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:20px;font-weight:700;letter-spacing:-0.02em;text-decoration:none;}
  .logo svg{width:22px;height:22px;color:var(--accent);}
  nav{display:flex;gap:28px;font-size:14px;font-weight:500;letter-spacing:-0.005em;}
  nav a{color:var(--fg);text-decoration:none;}
  nav a:hover{color:var(--accent);}
  .cta{background:var(--accent);color:#fff;padding:9px 20px;border-radius:999px;font-size:13px;font-weight:500;text-decoration:none;}
  .note{padding:14px 28px;font-size:11px;color:var(--fg-muted);}
</style></head><body>
<div class="band">
  <a class="logo">
    <svg viewBox="0 0 32 32" fill="currentColor"><circle cx="11" cy="22" r="6"/><circle cx="22" cy="22" r="6"/><path d="M16 4 C 14 9, 11 13, 9 17" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M16 4 C 18 9, 21 13, 23 17" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    cherry
  </a>
  <nav><a>Was ist Cherry?</a><a>Workshop</a><a>Über uns</a><a>Community</a></nav>
  <a class="cta">Jetzt mitmachen</a>
</div>
<p class="note">Modern fintech header — white canvas, hairline border, lowercase wordmark, red mark, pill CTA.</p>
</body></html>
