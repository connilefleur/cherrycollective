<!doctype html><html><head><meta charset="utf-8"><title>Type — Italic accent</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:36px 32px;background:var(--bg);}
  .demo{font-family:var(--font-sans);font-weight:700;font-size:72px;line-height:1.0;letter-spacing:-0.04em;color:var(--fg);}
  .demo em{font-family:var(--font-serif);font-style:italic;font-weight:400;color:var(--accent);letter-spacing:-0.01em;}
  .note{font-family:var(--font-sans);font-size:12px;color:var(--fg-muted);margin-top:18px;line-height:1.55;max-width:560px;}
  .note b{color:var(--fg);font-weight:600;}
  .note em{font-family:var(--font-serif);font-style:italic;color:var(--accent);}
</style></head><body>
<div class="demo">Let's talk <em>money.</em></div>
<p class="note"><b>Single-word italic accent.</b> The whole headline is a modern bold sans (Inter 700, tight tracking). One emotionally significant word — <em>money</em>, <em>women</em>, <em>now</em> — switches to <em>Instrument Serif italic</em> in cherry red. This is the only place a serif appears in the system.</p>
</body></html>
