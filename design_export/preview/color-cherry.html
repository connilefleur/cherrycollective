<!doctype html><html><head><meta charset="utf-8"><title>Color — Cherry primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg);}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .sw{aspect-ratio:1.4/1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-family:var(--font-sans);font-size:11px;line-height:1.3;border:1px solid var(--border);}
  .sw .name{font-weight:600;letter-spacing:-0.01em;}
  .sw .hex{opacity:0.85;font-variant-numeric:tabular-nums;}
  .label{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-muted);margin:0 0 12px;}
</style></head><body>
<p class="label">Cherry — primary scale</p>
<div class="row">
  <div class="sw" style="background:var(--cherry-50);color:var(--cherry-900)"><div class="name">cherry-50</div><div class="hex">#fff1f0</div></div>
  <div class="sw" style="background:var(--cherry-100);color:var(--cherry-900)"><div class="name">cherry-100</div><div class="hex">#ffdcd8</div></div>
  <div class="sw" style="background:var(--cherry-200);color:var(--cherry-900)"><div class="name">cherry-200</div><div class="hex">#ffb4ad</div></div>
  <div class="sw" style="background:var(--cherry-300);color:var(--cherry-900)"><div class="name">cherry-300</div><div class="hex">#ff857b</div></div>
  <div class="sw" style="background:var(--cherry-400);color:#fff"><div class="name">cherry-400</div><div class="hex">#ff4f43</div></div>
  <div class="sw" style="background:var(--cherry-500);color:#fff"><div class="name">cherry-500 ★</div><div class="hex">#f31a09</div></div>
  <div class="sw" style="background:var(--cherry-600);color:#fff"><div class="name">cherry-600</div><div class="hex">#d3140a</div></div>
  <div class="sw" style="background:var(--cherry-700);color:#fff"><div class="name">cherry-700</div><div class="hex">#a8120c</div></div>
  <div class="sw" style="background:var(--cherry-800);color:#fff"><div class="name">cherry-800</div><div class="hex">#6f1410</div></div>
  <div class="sw" style="background:var(--cherry-900);color:#fff"><div class="name">cherry-900</div><div class="hex">#3a0908</div></div>
</div>
</body></html>
