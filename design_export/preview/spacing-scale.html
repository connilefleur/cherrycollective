<!doctype html><html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../spacing.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-paper);font-family:var(--font-body);}
  .row{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--fg-muted);padding:4px 0;}
  .row b{flex:0 0 90px;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;}
  .bar{height:14px;background:var(--cherry-500);border-radius:3px;}
  .px{flex:0 0 56px;text-align:right;font-variant-numeric:tabular-nums;}
</style></head><body>
<div class="row"><b>--space-1</b><div class="px">4px</div><div class="bar" style="width:4px"></div></div>
<div class="row"><b>--space-2</b><div class="px">8px</div><div class="bar" style="width:8px"></div></div>
<div class="row"><b>--space-3</b><div class="px">12px</div><div class="bar" style="width:12px"></div></div>
<div class="row"><b>--space-4</b><div class="px">16px</div><div class="bar" style="width:16px"></div></div>
<div class="row"><b>--space-5</b><div class="px">24px</div><div class="bar" style="width:24px"></div></div>
<div class="row"><b>--space-6</b><div class="px">32px</div><div class="bar" style="width:32px"></div></div>
<div class="row"><b>--space-7</b><div class="px">48px</div><div class="bar" style="width:48px"></div></div>
<div class="row"><b>--space-8</b><div class="px">64px</div><div class="bar" style="width:64px"></div></div>
<div class="row"><b>--space-9</b><div class="px">96px</div><div class="bar" style="width:96px"></div></div>
<div class="row"><b>--space-10</b><div class="px">128px</div><div class="bar" style="width:128px"></div></div>
</body></html>
