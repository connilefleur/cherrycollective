<!doctype html><html><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:32px 28px;background:var(--bg);}
  .row{display:flex;align-items:baseline;gap:18px;padding:14px 0;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .meta{flex:0 0 130px;font-family:var(--font-sans);font-size:11px;color:var(--fg-muted);line-height:1.4;}
  .meta .name{font-weight:600;color:var(--fg);font-size:12px;letter-spacing:0.04em;text-transform:uppercase;display:block;margin-bottom:2px;}
  .spec{flex:1;color:var(--fg);}
  .display-xl{font-family:var(--font-sans);font-weight:700;font-size:64px;line-height:1.0;letter-spacing:-0.04em;}
  .display-lg{font-family:var(--font-sans);font-weight:700;font-size:44px;line-height:1.05;letter-spacing:-0.04em;}
  .display-md{font-family:var(--font-sans);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-0.025em;}
  em{font-family:var(--font-serif);font-style:italic;font-weight:400;color:var(--accent);letter-spacing:-0.01em;}
</style></head><body>
<div class="row"><div class="meta"><span class="name">Display XL</span>Inter 700 64/1.0<br>tracking -0.04em</div><div class="spec display-xl">Let's talk <em>money.</em></div></div>
<div class="row"><div class="meta"><span class="name">Display LG</span>Inter 700 44/1.05</div><div class="spec display-lg">Investing made for women.</div></div>
<div class="row"><div class="meta"><span class="name">Display MD</span>Inter 700 30/1.1</div><div class="spec display-md">Eine fängt an. <em>Viele folgen.</em></div></div>
</body></html>
