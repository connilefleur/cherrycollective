<!doctype html><html><head><meta charset="utf-8"><title>Color — Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg);}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px;}
  .sw{aspect-ratio:1.4/1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-family:var(--font-sans);font-size:11px;line-height:1.3;border:1px solid var(--border);}
  .sw .name{font-weight:600;letter-spacing:-0.01em;}
  .sw .hex{opacity:0.85;font-variant-numeric:tabular-nums;}
  .label{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-muted);margin:0 0 12px;}
</style></head><body>
<p class="label">Neutrals — surfaces &amp; ink</p>
<div class="row">
  <div class="sw" style="background:var(--neutral-0);color:var(--fg)"><div class="name">neutral-0 ★</div><div class="hex">#ffffff</div></div>
  <div class="sw" style="background:var(--neutral-25);color:var(--fg)"><div class="name">neutral-25</div><div class="hex">#fbfaf9</div></div>
  <div class="sw" style="background:var(--neutral-50);color:var(--fg)"><div class="name">neutral-50</div><div class="hex">#f5f3f1</div></div>
  <div class="sw" style="background:var(--neutral-100);color:var(--fg)"><div class="name">neutral-100</div><div class="hex">#ebe8e5</div></div>
  <div class="sw" style="background:var(--neutral-200);color:var(--fg)"><div class="name">neutral-200</div><div class="hex">#d8d4cf</div></div>
</div>
<div class="row">
  <div class="sw" style="background:var(--neutral-300);color:#fff"><div class="name">neutral-300</div><div class="hex">#b9b3ac</div></div>
  <div class="sw" style="background:var(--neutral-400);color:#fff"><div class="name">neutral-400</div><div class="hex">#8c857d</div></div>
  <div class="sw" style="background:var(--neutral-500);color:#fff"><div class="name">neutral-500</div><div class="hex">#66605a</div></div>
  <div class="sw" style="background:var(--neutral-700);color:#fff"><div class="name">neutral-700</div><div class="hex">#2f2c29</div></div>
  <div class="sw" style="background:var(--neutral-900);color:#fff"><div class="name">neutral-900 ★</div><div class="hex">#0e0d0c</div></div>
</div>
</body></html>
